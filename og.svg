<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- background -->
  <rect width="1200" height="630" fill="#0b0f14"/>
  <!-- subtle inner border -->
  <rect x="24" y="24" width="1152" height="582" rx="20" fill="none" stroke="#1e2630" stroke-width="2"/>

  <g font-family="Menlo, 'SF Mono', ui-monospace, monospace">
    <!-- top brand -->
    <text x="88" y="118" font-size="34" font-weight="700" fill="#5ad1a0">&gt;_</text>
    <text x="140" y="118" font-size="30" font-weight="600" fill="#eaf1f8">md-saifullah</text>

    <!-- terminal window dots (top-right) -->
    <circle cx="1050" cy="104" r="9" fill="#ff5f56"/>
    <circle cx="1082" cy="104" r="9" fill="#ffbd2e"/>
    <circle cx="1114" cy="104" r="9" fill="#27c93f"/>

    <!-- name -->
    <text x="86" y="300" font-size="96" font-weight="700" fill="#eaf1f8" letter-spacing="-2">Md. Saifullah</text>

    <!-- role -->
    <text x="90" y="372" font-size="44" font-weight="600" fill="#5ad1a0">Software Engineer (iOS)</text>

    <!-- skills -->
    <text x="90" y="448" font-size="28" fill="#8a97a8">SwiftUI · modular architecture · networking · testing</text>
    <text x="90" y="490" font-size="28" fill="#8a97a8">4+ years shipping production iOS apps</text>

    <!-- faux prompt -->
    <text x="90" y="566" font-size="26" fill="#5ad1a0">saifullah@dhaka<tspan fill="#8a97a8">:</tspan><tspan fill="#58a6ff">~</tspan><tspan fill="#8a97a8">$</tspan></text>
    <rect x="330" y="546" width="14" height="26" fill="#5ad1a0"/>

    <!-- url bottom-right -->
    <text x="1114" y="566" font-size="26" fill="#58a6ff" text-anchor="end">md-saifullah.github.io</text>
  </g>
</svg>
